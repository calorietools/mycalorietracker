<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <title>Calorie Tracker</title>
</head>
<body>
    <div class="main">
        <div class="sidebar">
            <div class="sidebar-item">
                <a href = "index.html">
                    <button class = "sidebar-button" style = "background-color: #DCE5DA";>
                        <span class="material-symbols-outlined">home</span>
                        <p>Home</p>
                    </button>
                </a>              
            </div>
            <div class="sidebar-item">
                <button class = "sidebar-button" style = "background-color: #DCE5DA"; >
                    <span class="material-symbols-outlined">book</span>
                    <p>Food Diary</p>
                </button>
            </div>
            <div class="sidebar-item">
              <a href = "profile.html">
                <button class = "sidebar-button" style = "background-color: #DCE5DA";>
                    <span class="material-symbols-outlined">account_circle</span>
                    <p>Profile</p>
                </button>
              </a>
            </div>
        </div>


    

    <section class="cards">

      <div class="card">
        <h2 id = "addFood">Add food</h2>
        <form id="add-form">
          <input type="text" id="food-name" placeholder="Food name" required />
          <input type="number" id="food-calories" placeholder="Calories per serving (kcal)" min="0" step="1" required />
          <input type="number" id="servings" placeholder="Number of servings" min="0" step="1" required />
          <select id="meal-type">
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dinner">Dinner</option>
            <option value="Snack">Snack</option>
          </select>
          <button type="submit">Add</button>
        </form>
      </div>
    </section>

    <section class="card list">
      <h2>Food log</h2>
      <div id="items"></div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="secondary" id="set-goal">Set daily goal</button>
        <button class="secondary" id="reset-day">Reset day</button>
      </div>
    </section>

  </div>

    </div>
</body>
</html>
