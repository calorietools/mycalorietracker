<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <title>Calorie Tracker</title>
</head>
<body>
    <div class="main">
        <div class="sidebar">
            <div class="sidebar-item">
                <span class="material-symbols-outlined">home</span>
                <p>Home</p>
            </div>
            <div class="sidebar-item">
                <span class="material-symbols-outlined">book</span>
                <p>Food Diary</p>
            </div>
            <div class="sidebar-item">
                <span class="material-symbols-outlined">account_circle</span>
                <p>Profile</p>
            </div>
        </div>
        <div class="main-content">
            <div class="header">
                <div class="title-card">
                    <h1>Welcome back!</h1>
                    <p>Get an overview of your day so far</p>
                </div>
            </div>

            <div class="meter">
                <div class="meter-heading">
                    <span class="material-symbols-outlined">donut_large</span>
                    <h2>Activity meter</h2>
                </div>
                <div class="meter-components">
                    <div class="meter-item">
                        <p id="supplied" class="meter-large">0</p>
                        <p class="meter-small">supplied</p>
                    </div>
                    <div class="meter-item">
                        <p id="goal" style="color:#316a42" class="meter-large">0</p>
                        <p class="meter-small">calories left</p>
                    </div>
                    <div class="meter-item">
                        <p id="burned" class="meter-large">0</p>
                        <p class="meter-small">burned</p>                        
                    </div>
                </div>
            </div>

            <div class="recent">
                <div class="recent-ex">
                    <span class="material-symbols-outlined">exercise</span>
                    <h2>Recent Exercise</h2>
                    <div class="recent-ex-cont">                                                                  
                    </div>
                </div>
                <div class="recent-food">
                    <span class="material-symbols-outlined">lunch_dining</span>
                    <h2>Food Summary</h2>
                    <div class="food-cont">
                    </div>
                </div>
            </div>

        </div>
    </div>

    <template>
        <div class="ex-item">
            <div class="ex-icon">
                <span class="material-symbols-outlined">error</span>
                <p>Run</p>
            </div>
            <p class="ex-end">500 kcal</p>
        </div>
    </template>

    <template>
        <div class="food-item">
            <span class="material-symbols-outlined">error</span>
            <p id="type">Breakfast</p>
            <p id="kcal">500 kcal</p>
        </div>        
    </template>
<script src="index.js"></script>
</body>
</html>
